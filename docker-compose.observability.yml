# Grafana Observability Stack - Docker Compose
# 
# WHY THIS STACK:
# - Grafana: Visualization and dashboards
# - Loki: Log aggregation (like Elasticsearch but cheaper/simpler)
# - Promtail: Log collector (sends logs from files to Loki)
#
# OBSERVABILITY FLOW:
# 1. Your app writes JSON logs to stdout/files
# 2. Promtail collects logs and sends to Loki
# 3. Grafana queries Loki and displays in dashboards
#
# ALTERNATIVES:
# - For production, use Grafana Cloud (managed, scalable)
# - For local dev, use this docker-compose (free, fast)

version: '3.8'

services:
  # Loki: Log aggregation system
  # WHY: Stores and indexes logs for fast querying
  # COST: Free and lightweight compared to ELK stack
  loki:
    image: grafana/loki:2.9.0
    container_name: ticketing-loki
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - ./observability/loki-config.yaml:/etc/loki/local-config.yaml
      - loki-data:/loki
    networks:
      - observability
    restart: unless-stopped

  # Promtail: Log shipper
  # WHY: Collects logs from Docker containers and sends to Loki
  # PATTERN: Tails log files, adds labels, forwards to Loki
  promtail:
    image: grafana/promtail:2.9.0
    container_name: ticketing-promtail
    volumes:
      - ./observability/promtail-config.yaml:/etc/promtail/config.yaml
      - /var/log:/var/log
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock
    command: -config.file=/etc/promtail/config.yaml
    networks:
      - observability
    restart: unless-stopped
    depends_on:
      - loki

  # Grafana: Visualization platform
  # WHY: Beautiful dashboards, powerful querying (LogQL)
  # ACCESS: http://localhost:3001 (admin/admin)
  grafana:
    image: grafana/grafana:10.1.0
    container_name: ticketing-grafana
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
      # Auto-provision Loki as a data source
      - GF_PATHS_PROVISIONING=/etc/grafana/provisioning
    volumes:
      - grafana-data:/var/lib/grafana
      - ./observability/grafana/provisioning:/etc/grafana/provisioning
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards
    networks:
      - observability
    restart: unless-stopped
    depends_on:
      - loki

networks:
  observability:
    driver: bridge

volumes:
  loki-data:
  grafana-data:
