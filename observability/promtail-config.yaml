# Promtail Configuration
# WHY: Configures log collection from Docker containers
# FLOW: Docker logs → Promtail → Loki → Grafana

server:
  http_listen_port: 9080
  grpc_listen_port: 0

# Client configuration - where to send logs
# WHY: Points Promtail to your Loki instance
clients:
  - url: http://loki:3100/loki/api/v1/push

# Positions file - tracks which logs have been read
# WHY: Prevents duplicate log ingestion after restart
positions:
  filename: /tmp/positions.yaml

# Scrape configs - what logs to collect
scrape_configs:
  # Collect logs from Docker containers
  # WHY: Your app runs in Docker, so we tail container logs
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
    
    # Add labels based on Docker container metadata
    # WHY: Labels enable filtering in Grafana (e.g., "show logs for ticketing-api")
    relabel_configs:
      # Container name as label
      - source_labels: ['__meta_docker_container_name']
        regex: '/(.*)'
        target_label: 'container'
      
      # Image name as label
      - source_labels: ['__meta_docker_container_image']
        target_label: 'image'
      
      # Container ID as label
      - source_labels: ['__meta_docker_container_id']
        target_label: 'container_id'
    
    # Pipeline stages - process log lines
    # WHY: Extract fields from JSON logs for indexing
    pipeline_stages:
      # Parse JSON logs
      # WHY: Your app emits JSON, so we parse it to extract fields
      - json:
          expressions:
            level: level
            timestamp: timestamp
            request_id: request_id
            user_id: user_id
            method: method
            path: path
            status_code: status_code
            duration_ms: duration_ms
            outcome: outcome
      
      # Add parsed fields as labels
      # WHY: Labels enable querying (e.g., "show all errors", "show requests for user_123")
      - labels:
          level:
          outcome:
          method:
          status_code:
      
      # Set log level based on parsed level
      # WHY: Enables filtering by severity in Grafana
      - match:
          selector: '{level="error"}'
          stages:
            - labels:
                severity: error
      
      # Set timestamp from log entry
      # WHY: Use app's timestamp, not Promtail's collection time
      - timestamp:
          source: timestamp
          format: RFC3339Nano
      
      # Output the processed log line
      - output:
          source: line
