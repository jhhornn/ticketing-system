# Grafana Datasource Provisioning
# WHY: Auto-configure Loki as a datasource when Grafana starts
# BENEFIT: No manual setup needed - Grafana is ready to query logs immediately

apiVersion: 1

datasources:
  # Loki datasource for log queries
  - name: Loki
    type: loki
    access: proxy
    url: http://loki:3100
    isDefault: true
    version: 1
    editable: true
    
    # JSON data configuration
    jsonData:
      # Max lines to return per query
      # WHY: Prevent overwhelming Grafana with too many logs
      maxLines: 1000
      
      # Derived fields - create links from log fields
      # WHY: Click on request_id to see all related logs
      derivedFields:
        - datasourceUid: loki
          matcherRegex: "request_id\":\"([^\"]+)"
          name: "Request ID"
          url: "$${__value.raw}"
