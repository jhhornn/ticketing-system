# Grafana Dashboard Provisioning
# WHY: Auto-load dashboards from files when Grafana starts
# BENEFIT: Version-controlled dashboards in your repo

apiVersion: 1

providers:
  - name: 'Ticketing System Dashboards'
    orgId: 1
    folder: 'Ticketing System'
    type: file
    disableDeletion: false
    updateIntervalSeconds: 10
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: true
